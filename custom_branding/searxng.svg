<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c084fc;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Shield & Search Icon -->
  <g transform="translate(15, 10)">
    <!-- Shield Outline -->
    <path d="M 40,5 Q 65,15 75,30 Q 75,60 40,75 Q 5,60 5,30 Q 15,15 40,5 Z" fill="url(#grad)" opacity="0.15" />
    <path d="M 40,5 Q 65,15 75,30 Q 75,60 40,75 Q 5,60 5,30 Q 15,15 40,5 Z" fill="none" stroke="url(#grad)" stroke-width="3.5" />
    
    <!-- Magnifying Glass inside shield -->
    <circle cx="37" cy="38" r="14" fill="none" stroke="#ffffff" stroke-width="3" />
    <line x1="47" y1="48" x2="57" y2="58" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
    <!-- Privacy Lock Shackle -->
    <path d="M 33,35 A 4,4 0 0,1 41,35" fill="none" stroke="#38bdf8" stroke-width="2" />
  </g>

  <!-- Text -->
  <text x="105" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    PRIVATE<tspan fill="url(#grad)">SEARCH</tspan>
  </text>
  <text x="107" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="2">
    ZERO TRACKING • 100% PRIVATE
  </text>
</svg>
